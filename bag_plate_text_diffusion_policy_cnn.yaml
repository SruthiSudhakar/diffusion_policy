# Same as bag_plate_image_only_diffusion_policy_cnn.yaml, but with an
# additional CLIP text-embed conditioning input. Requires that
# data/bag_plate/replay.zarr was built by
# scripts_upright_bottle/convert_upright_bottle_to_zarr.py with --prefixes
# box glass remote (so meta/episode_text_embed exists).
_target_: diffusion_policy.workspace.train_diffusion_unet_hybrid_workspace.TrainDiffusionUnetHybridWorkspace
checkpoint:
  save_last_ckpt: true
  save_last_snapshot: false
  topk:
    format_str: epoch={epoch:04d}-train_loss={train_loss:.4f}.ckpt
    k: 100
    mode: min
    monitor_key: train_loss
dataloader:
  batch_size: 8
  num_workers: 4
  persistent_workers: true
  pin_memory: false
  shuffle: true
dataset_obs_steps: 1
ema:
  _target_: diffusion_policy.model.diffusion.ema_model.EMAModel
  inv_gamma: 1.0
  max_value: 0.9999
  min_value: 0.0
  power: 0.75
  update_after_step: 0
exp_name: bag_plate_text
horizon: 32
keypoint_visible_rate: 1.0
logging:
  group: null
  id: null
  mode: online
  name: bag_plate_text_diffusion_policy_cnn
  project: diffusion_policy_bag_plate
  resume: false
  tags:
  - train_diffusion_unet_hybrid
  - bag_plate_text
  - default
multi_run:
  run_dir: data/outputs/bag_plate_text_diffusion_policy_cnn
  wandb_name_base: bag_plate_text_diffusion_policy_cnn
n_action_steps: 16
n_latency_steps: 0
n_obs_steps: 1
name: train_diffusion_unet_hybrid
obs_as_global_cond: true
optimizer:
  _target_: torch.optim.AdamW
  betas:
  - 0.95
  - 0.999
  eps: 1.0e-08
  lr: 0.0001
  weight_decay: 1.0e-06
past_action_visible: false
policy:
  _target_: diffusion_policy.policy.diffusion_unet_hybrid_image_policy.DiffusionUnetHybridImagePolicy
  cond_predict_scale: true
  crop_shape:
  - 336
  - 600
  diffusion_step_embed_dim: 128
  down_dims:
  - 512
  - 1024
  - 2048
  eval_fixed_crop: true
  horizon: 32
  kernel_size: 5
  n_action_steps: 16
  n_groups: 8
  n_obs_steps: 1
  noise_scheduler:
    _target_: diffusers.schedulers.scheduling_ddpm.DDPMScheduler
    beta_end: 0.02
    beta_schedule: squaredcos_cap_v2
    beta_start: 0.0001
    clip_sample: true
    num_train_timesteps: 100
    prediction_type: epsilon
    variance_type: fixed_small
  num_inference_steps: 100
  obs_as_global_cond: true
  obs_encoder_group_norm: true
  # CFG-style per-sample dropout on text_embed during training.
  # Forces the image branch to learn useful features (without this the model
  # collapses onto text and ignores images). 0.0 keeps old behavior.
  # Recommended starting point: 0.3 — high enough that the model can't
  # shortcut on text, low enough that it still learns to use the prompt.
  text_embed_dropout_prob: 0.3
  shape_meta:
    action:
      shape:
      - 7
    obs:
      image1:
        shape:
        - 3
        - 360
        - 640
        type: rgb
      image2:
        shape:
        - 3
        - 360
        - 640
        type: rgb
      text_embed:
        shape:
        - 512
        type: low_dim
shape_meta:
  action:
    shape:
    - 7
  obs:
    image1:
      shape:
      - 3
      - 360
      - 640
      type: rgb
    image2:
      shape:
      - 3
      - 360
      - 640
      type: rgb
    text_embed:
      shape:
      - 512
      type: low_dim
task:
  name: bag_plate_text
  image_shape:
  - 3
  - 360
  - 640
  dataset_path: data/bag_plate/replay.zarr
  shape_meta:
    action:
      shape:
      - 7
    obs:
      image1:
        shape:
        - 3
        - 360
        - 640
        type: rgb
      image2:
        shape:
        - 3
        - 360
        - 640
        type: rgb
      text_embed:
        shape:
        - 512
        type: low_dim
  env_runner:
    _target_: diffusion_policy.env_runner.real_pusht_image_runner.RealPushTImageRunner
  dataset:
    _target_: diffusion_policy.dataset.upright_bottle_image_dataset.UprightBottleImageDataset
    zarr_path: data/bag_plate/replay.zarr
    use_state: false
    horizon: 32
    pad_before: 0
    pad_after: 15
    seed: 42
    val_ratio: 0.05
    max_train_episodes: null
task_name: bag_plate_text
training:
  checkpoint_every: 50
  debug: false
  device: cuda:0
  gradient_accumulate_every: 1
  lr_scheduler: cosine
  lr_warmup_steps: 500
  max_train_steps: null
  max_val_steps: null
  num_epochs: 3050
  resume: false
  rollout_every: 50
  sample_every: 5
  seed: 42
  tqdm_interval_sec: 1.0
  use_ema: true
  val_every: 1
val_dataloader:
  batch_size: 8
  num_workers: 4
  persistent_workers: true
  pin_memory: false
  shuffle: false
